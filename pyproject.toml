[project]
name = "gerent"
version = "0.1.0"
description = "An autonomous, provider-agnostic AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "croniter>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
db = ["asyncpg>=0.29"]
voice = ["sounddevice>=0.4", "numpy>=1.26", "onnxruntime>=1.18", "websockets>=12"]
voice-local = ["faster-whisper>=1.0", "piper-tts>=1.2"]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
gerent = "gerent.ports.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gerent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults; B008 is a false
# positive for every CLI parameter here.
"gerent/ports/cli.py" = ["B008"]
